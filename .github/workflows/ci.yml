name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # contracts se compila antes que nada: api y web dependen de sus tipos.
      - run: pnpm --filter @bravo/contracts build

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: Tests de integración
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bravo
          POSTGRES_PASSWORD: bravo_ci
          POSTGRES_DB: bravo_credit_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bravo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://bravo:bravo_ci@localhost:5432/bravo_credit_test?schema=public
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bravo/contracts build
      - run: pnpm --filter @bravo/api prisma:migrate:deploy
      - run: pnpm --filter @bravo/api test:integration
